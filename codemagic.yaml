workflows:
  android-release:
    name: Call Guardian Android App Bundle
    max_build_duration: 60
    environment:
      groups:
        - call-guardian-production
        - call-guardian-signing
      vars:
        NODE_VERSION: 20
    scripts:
      - name: Install workspace dependencies
        script: |
          cd "$CM_BUILD_DIR"
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Set up Android signing
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_KEYSTORE_PATH"
          chmod 600 "$CM_KEYSTORE_PATH"
      - name: Generate Android project with call-screening service
        script: |
          cd artifacts/call-guardian-mobile
          pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build signed Android App Bundle
        script: |
          cd artifacts/call-guardian-mobile/android
          ./gradlew bundleRelease
    artifacts:
      - artifacts/call-guardian-mobile/android/app/build/outputs/bundle/release/app-release.aab