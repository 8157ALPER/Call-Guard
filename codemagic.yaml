workflows:
  android-release:
    name: Call Guardian Android App Bundle
    max_build_duration: 60
    environment:
      groups:
        - call-guardian-production
        - call-guardian-signing
      vars:
        NODE_VERSION: 20
    scripts:
      - name: Install workspace dependencies
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is not set}"
          test -f package.json
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Set up Android signing
        script: |
          set -euo pipefail
          printf '%s' "$CM_KEYSTORE" | tr -d '\r\n ' | base64 --decode > "$CM_KEYSTORE_PATH"
          chmod 600 "$CM_KEYSTORE_PATH"
          KEYSTORE_SIZE="$(wc -c < "$CM_KEYSTORE_PATH" | tr -d ' ')"
          echo "Decoded keystore size: ${KEYSTORE_SIZE} bytes"
          test "$KEYSTORE_SIZE" -gt 1000
          keytool -list \
            -storetype PKCS12 \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            >/dev/null
          echo "Android keystore and store password verified."
      - name: Generate Android project with call-screening service
        script: |
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is not set}/artifacts/call-guardian-mobile"
          pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build signed Android App Bundle
        script: |
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is not set}/artifacts/call-guardian-mobile/android"
          ./gradlew bundleRelease
    artifacts:
      - artifacts/call-guardian-mobile/android/app/build/outputs/bundle/release/app-release.aab