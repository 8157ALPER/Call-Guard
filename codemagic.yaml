workflows:
  android-release:
    name: Call Guardian Android App Bundle
    max_build_duration: 60
    environment:
      groups:
        - call-guardian-production
        - call-guardian-signing
      vars:
        NODE_VERSION: 20
    scripts:
      - name: Install workspace dependencies
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is not set}"
          test -f package.json
          pnpm --version
          pnpm install --frozen-lockfile
      - name: Set up Android signing
        script: |
          set -euo pipefail
          python3 - "$CM_KEYSTORE_PATH" <<'PY'
          import base64
          import binascii
          import os
          import sys

          encoded = "".join(os.environ["CM_KEYSTORE"].split())
          print(f"Stored keystore value length: {len(encoded)} characters")
          encoded += "=" * (-len(encoded) % 4)
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except binascii.Error as error:
              raise SystemExit(f"CM_KEYSTORE is not valid Base64: {error}")
          with open(sys.argv[1], "wb") as keystore:
              keystore.write(decoded)
          PY
          chmod 600 "$CM_KEYSTORE_PATH"
          KEYSTORE_SIZE="$(wc -c < "$CM_KEYSTORE_PATH" | tr -d ' ')"
          echo "Decoded keystore size: ${KEYSTORE_SIZE} bytes"
          test "$KEYSTORE_SIZE" -gt 1000
          keytool -list \
            -storetype PKCS12 \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            >/dev/null
          echo "Android keystore and store password verified."
      - name: Generate Android project with call-screening service
        script: |
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is not set}/artifacts/call-guardian-mobile"
          pnpm exec expo prebuild --platform android --non-interactive --no-install
      - name: Build signed Android App Bundle
        script: |
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is not set}/artifacts/call-guardian-mobile/android"
          ./gradlew bundleRelease
    artifacts:
      - artifacts/call-guardian-mobile/android/app/build/outputs/bundle/release/app-release.aab