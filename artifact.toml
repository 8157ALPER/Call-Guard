kind = "mobile"
previewPath = "/mobile/"
title = "Call Guardian Mobile"
description = "A senior-friendly mobile safety app that helps protect elderly people from phone fraud and scams through call screening, trusted contacts, consent controls, and family alerts."
version = "1.0.0"
id = "artifacts/call-guardian-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 25886

[services.development]
run = "pnpm --filter @workspace/call-guardian-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/call-guardian-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/call-guardian-mobile", "run", "serve" ]

[services.env]
PORT = "25886"
BASE_PATH = "/mobile/"
